name: Build Hololive full-art test v0.0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-hololive-fullart-test-v005.yml'
      - 'hololive-fullart-test/src/main/java/hololivemod/patches/DescriptionAlignmentPatch.java'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Start from the tested v0.0.4 JAR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          mkdir -p build/root build/stubsrc build/stub-classes dist
          curl -fL --retry 3 \
            'https://github.com/yukihira246/StSMOD/releases/download/hololive-fullart-test-v0.0.4/HololiveFullArtTest-0.0.4.jar' \
            -o build/base.jar
          (cd build/root && jar xf ../base.jar)

      - name: Compile left-alignment patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/stubsrc/basemod
          mkdir -p build/stubsrc/com/evacipated/cardcrawl/modthespire/lib
          mkdir -p build/stubsrc/com/megacrit/cardcrawl/cards
          mkdir -p build/stubsrc/com/megacrit/cardcrawl/core
          mkdir -p build/stubsrc/com/megacrit/cardcrawl/screens

          cat > build/stubsrc/basemod/ReflectionHacks.java <<'EOF'
          package basemod;
          public final class ReflectionHacks {
              public static <T> T getPrivate(Object obj, Class<?> cls, String fieldName) { return null; }
          }
          EOF

          cat > build/stubsrc/com/evacipated/cardcrawl/modthespire/lib/SpirePatch.java <<'EOF'
          package com.evacipated.cardcrawl.modthespire.lib;
          import java.lang.annotation.ElementType;
          import java.lang.annotation.Retention;
          import java.lang.annotation.RetentionPolicy;
          import java.lang.annotation.Target;
          @Retention(RetentionPolicy.RUNTIME)
          @Target(ElementType.TYPE)
          public @interface SpirePatch { Class<?> clz(); String method(); }
          EOF

          cat > build/stubsrc/com/megacrit/cardcrawl/cards/DescriptionLine.java <<'EOF'
          package com.megacrit.cardcrawl.cards;
          public class DescriptionLine { public float width; }
          EOF

          cat > build/stubsrc/com/megacrit/cardcrawl/cards/AbstractCard.java <<'EOF'
          package com.megacrit.cardcrawl.cards;
          import java.util.ArrayList;
          public class AbstractCard {
              public String cardID;
              public ArrayList<DescriptionLine> description;
          }
          EOF

          cat > build/stubsrc/com/megacrit/cardcrawl/core/Settings.java <<'EOF'
          package com.megacrit.cardcrawl.core;
          public class Settings { public static float scale = 1F; }
          EOF

          cat > build/stubsrc/com/megacrit/cardcrawl/screens/SingleCardViewPopup.java <<'EOF'
          package com.megacrit.cardcrawl.screens;
          public class SingleCardViewPopup {}
          EOF

          javac -source 8 -target 8 -d build/stub-classes $(find build/stubsrc -name '*.java')
          javac -source 8 -target 8 -cp build/stub-classes -d build/root \
            hololive-fullart-test/src/main/java/hololivemod/patches/DescriptionAlignmentPatch.java

      - name: Make the frame visually lighter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import glob

          out = Path('build/root/img/card/fullart')
          out.mkdir(parents=True, exist_ok=True)
          font_path = (glob.glob('/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc') +
                       glob.glob('/usr/share/fonts/**/NotoSansCJK*.ttc', recursive=True))[0]
          type_font = ImageFont.truetype(font_path, 15)

          frame = Image.new('RGBA', (512,512), (0,0,0,0))
          d = ImageDraw.Draw(frame)

          # Card body is still 300x420 inside the 512 layer; UI is intentionally slimmer than v0.0.4.
          d.rounded_rectangle((104,44,408,468), radius=21, outline=(25,10,34,220), width=5)
          d.rounded_rectangle((106,46,406,466), radius=19, outline=(231,186,79,235), width=2)
          d.rounded_rectangle((110,50,402,462), radius=15, outline=(112,52,143,190), width=1)

          # Thinner title band.
          d.rounded_rectangle((142,64,387,99), radius=11,
                              fill=(30,12,42,150), outline=(220,177,77,205), width=1)
          d.line((158,98,371,98), fill=(116,58,146,170), width=1)

          # Narrower left type strip so it does not steal illustration space.
          d.rounded_rectangle((107,154,132,276), radius=8,
                              fill=(91,18,34,205), outline=(230,181,76,220), width=1)
          d.line((130,163,130,267), fill=(158,49,61,175), width=1)
          d.line((113,166,126,179), fill=(244,224,166,235), width=2)
          d.line((124,164,113,180), fill=(244,224,166,235), width=1)
          for ch,y in zip(['ア','タ','ッ','ク'], [194,213,232,251]):
              bbox = d.textbbox((0,0), ch, font=type_font)
              tw = bbox[2]-bbox[0]
              d.text((119.5-tw/2,y), ch, font=type_font, fill=(255,244,215,240))

          # Description panel: less opaque, one-pixel border.
          d.rounded_rectangle((124,330,390,438), radius=14,
                              fill=(17,8,27,160), outline=(200,162,88,195), width=1)
          d.line((141,330,373,330), fill=(117,55,147,165), width=1)

          # Minimal corner marks.
          for x,y,sx,sy in [(116,57,1,1),(396,57,-1,1),(116,455,1,-1),(396,455,-1,-1)]:
              d.line((x,y,x+sx*13,y), fill=(220,174,73,175), width=1)
              d.line((x,y,x,y+sy*13), fill=(220,174,73,175), width=1)

          frame.save(out/'frame_attack_512.png')
          frame.resize((1024,1024), Image.Resampling.LANCZOS).save(out/'frame_attack_1024.png')
          PY

      - name: Update metadata and package
        shell: bash
        run: |
          cat > build/root/ModTheSpire.json <<'EOF'
          {
            "modid": "HololiveFullArtTest",
            "name": "Hololive Full Art Test",
            "author_list": ["yukihira246"],
            "description": "v0.0.5 layout test: left-aligned vanilla description rendering, slimmer title/description/type frame, bottom-right rarity retained. Hololive_Strike gameplay unchanged.",
            "version": "0.0.5",
            "sts_version": "12-18-2022",
            "mts_version": "3.30.3",
            "dependencies": ["HololiveMod"]
          }
          EOF
          rm -f build/root/META-INF/MANIFEST.MF
          jar cf dist/HololiveFullArtTest-0.0.5.jar -C build/root .
          jar tf dist/HololiveFullArtTest-0.0.5.jar | sort

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: HololiveFullArtTest-0.0.5
          path: dist/HololiveFullArtTest-0.0.5.jar
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='hololive-fullart-test-v0.0.5'
          JAR='dist/HololiveFullArtTest-0.0.5.jar'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --title 'Hololive Full Art Test v0.0.5' \
              --notes 'UI-only iteration: vanilla description renderer is preserved but line widths are normalized to produce a shared left edge. Frame, title band and vertical ATTACK strip are thinner; rarity position is unchanged. The supplied Chloe attachment could not yet be embedded because the current local attachment runtime is unavailable, so the existing layout placeholder remains. Strike gameplay is unchanged.'
          fi
